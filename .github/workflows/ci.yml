name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: myyntijarjestelma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure CI environment
        env:
          UPSTASH_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/myyntijarjestelma_test?schema=public" >> "$GITHUB_ENV"
          echo "DATABASE_URL_TEST=postgresql://postgres:password@localhost:5432/myyntijarjestelma_test?schema=public" >> "$GITHUB_ENV"
          echo "UPSTASH_REDIS_REST_URL=$UPSTASH_URL" >> "$GITHUB_ENV"
          echo "UPSTASH_REDIS_REST_TOKEN=$UPSTASH_TOKEN" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
